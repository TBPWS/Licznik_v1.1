<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>Tabele — SAFE MODE Android</title>

  <style>
    body {
      font-family: Arial;
      background: #0f0f0f;
      color: #e0e0e0;
      padding: 20px;
    }

    input {
      margin-bottom: 10px;
      font-size: 16px;
      padding: 6px;
      background: #1c1c1c;
      border: 1px solid #333;
      color: #e0e0e0;
      border-radius: 6px;
    }

    .tabs {
      display: flex;
      gap: 10px;
      margin: 20px 0;
      flex-wrap: wrap;
    }

    .tab-btn {
      padding: 10px 18px;
      background: #1c1c1c;
      border: 1px solid #333;
      border-radius: 6px;
      cursor: pointer;
      color: #e0e0e0;
      transition: 0.25s;
      font-weight: bold;
    }

    .tab-btn.active {
      background: #444;
      border-color: #777;
    }

    /* ⭐ NORMALNE TABELKI — tylko poziomy scroll */
    .table-scroll {
      overflow-x: auto;      /* poziomy scroll */
      overflow-y: hidden;    /* brak pionowego scrolla */
      margin-bottom: 20px;
      -webkit-overflow-scrolling: touch;
    }

    .tabela-premium {
      border-collapse: collapse;
      width: 140%;           /* wymusza poziomy scroll */
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.4);
    }

    .tabela-premium td,
    .tabela-premium th {
      border: 1px solid rgba(255,255,255,0.1);
      padding: 8px 10px;
      color: #fff;
      white-space: nowrap;
      font-size: 14px;
      min-width: 110px;
    }

    .tabela-premium th {
      position: sticky;
      top: 0;
      background-color: #000;
      z-index: 5;
    }

    .hidden {
      display: none;
    }

    /* ⭐ SAFE MODE — Podsumowanie */
    .podsumowanie-wrapper {
      display: flex;
      gap: 0;
      margin-bottom: 20px;
    }

    /* lewa tabela — zamrożone 3 kolumny */
    .podsumowanie-left {
      width: 330px;          /* 3 kolumny */
      overflow-x: hidden;
      overflow-y: hidden;    /* brak pionowego scrolla */
    }

    /* prawa tabela — reszta kolumn */
    .podsumowanie-right {
      flex: 1;
      overflow-x: auto;      /* poziomy scroll */
      overflow-y: hidden;    /* brak pionowego scrolla */
      -webkit-overflow-scrolling: touch;
    }

    .podsumowanie-left .tabela-premium,
    .podsumowanie-right .tabela-premium {
      width: auto;
      box-shadow: none;
    }

    /* kolorowanie kolumn po prawej */
    .podsumowanie-right td.crypt,
    .podsumowanie-right th.crypt {
      background-color: #1e3c72 !important;
    }

    .podsumowanie-right td.vault,
    .podsumowanie-right th.vault {
      background-color: #0f9b0f !important;
    }

    .podsumowanie-right td.hermes,
    .podsumowanie-right th.hermes {
      background-color: #ff8c00 !important;
    }

    .podsumowanie-right td.ancients,
    .podsumowanie-right th.ancients {
      background-color: #8e2de2 !important;
    }
  </style>
</head>
<body>

  <input type="text" id="dataOd" placeholder="od">
  <input type="text" id="dataDo" placeholder="do">

  <div class="tabs" id="tabs"></div>
  <div id="tabele"></div>

  <script>
    fetch("https://raw.githubusercontent.com/TBPWS/Licznik_v1.1/main/data.json")
      .then(r => r.json())
      .then(allSheets => {
        const container = document.getElementById("tabele");
        const tabs = document.getElementById("tabs");

        Object.keys(allSheets).forEach(sheetName => {

          if (sheetName.toLowerCase().includes("ranking")) return;
          if (sheetName === "Dane") return;

          const rows = allSheets[sheetName];

          const btn = document.createElement("button");
          btn.className = "tab-btn";
          btn.textContent = sheetName;
          btn.dataset.tab = sheetName;
          tabs.appendChild(btn);

          let wrapper;

          /* ⭐ SAFE MODE — Podsumowanie */
          if (sheetName === "Podsumowanie") {

            wrapper = document.createElement("div");
            wrapper.className = "podsumowanie-wrapper hidden";
            wrapper.id = "tab_" + sheetName;

            const leftScroll = document.createElement("div");
            leftScroll.className = "podsumowanie-left";

            const rightScroll = document.createElement("div");
            rightScroll.className = "podsumowanie-right";

            const leftTable = document.createElement("table");
            leftTable.className = "tabela-premium";

            const rightTable = document.createElement("table");
            rightTable.className = "tabela-premium";

            rows.forEach((row, rowIndex) => {
              const trLeft = document.createElement("tr");
              const trRight = document.createElement("tr");

              row.forEach((cell, colIndex) => {
                const tag = rowIndex === 0 ? "th" : "td";
                const td = document.createElement(tag);
                td.textContent = cell;

                if (colIndex < 3) {
                  trLeft.appendChild(td);
                } else {
                  const header = String(rows[0][colIndex]).toLowerCase();
                  if (header.includes("crypt")) td.classList.add("crypt");
                  else if (header.includes("vault")) td.classList.add("vault");
                  else if (header.includes("hermes")) td.classList.add("hermes");
                  else if (header.includes("ancients")) td.classList.add("ancients");

                  trRight.appendChild(td);
                }
              });

              leftTable.appendChild(trLeft);
              rightTable.appendChild(trRight);
            });

            leftScroll.appendChild(leftTable);
            rightScroll.appendChild(rightTable);

            wrapper.appendChild(leftScroll);
            wrapper.appendChild(rightScroll);
            container.appendChild(wrapper);

          } else {
            /* ⭐ NORMALNE TABELKI */
            wrapper = document.createElement("div");
            wrapper.className = "table-scroll hidden";
            wrapper.id = "tab_" + sheetName;

            const table = document.createElement("table");
            table.className = "tabela-premium";

            rows.forEach((row, index) => {
              const tr = document.createElement("tr");
              row.forEach(cell => {
                const td = document.createElement(index === 0 ? "th" : "td");
                td.textContent = cell;
                tr.appendChild(td);
              });
              table.appendChild(tr);
            });

            wrapper.appendChild(table);
            container.appendChild(wrapper);
          }
        });

        /* przełączanie zakładek */
        document.querySelectorAll(".tab-btn").forEach(btn => {
          btn.addEventListener("click", () => {
            document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
            btn.classList.add("active");

            document.querySelectorAll(".table-scroll, .podsumowanie-wrapper")
              .forEach(t => t.classList.add("hidden"));

            const activeTable = document.getElementById("tab_" + btn.dataset.tab);
            if (activeTable) activeTable.classList.remove("hidden");
          });
        });

        const firstBtn = document.querySelector(".tab-btn");
        if (firstBtn) firstBtn.click();
      });
  </script>

</body>
</html>
