<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">

  <!-- ⭐ Android Ultra Viewport -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">

  <title>Tabele — Android Ultra</title>

  <style>
    body {
      font-family: Arial;
      background: #0f0f0f;
      color: #e0e0e0;
      padding: 20px;
    }

    input {
      margin-bottom: 10px;
      font-size: 16px;
      padding: 6px;
      background: #1c1c1c;
      border: 1px solid #333;
      color: #e0e0e0;
      border-radius: 6px;
    }

    .tabs {
      display: flex;
      gap: 10px;
      margin: 20px 0;
      flex-wrap: wrap;
    }

    .tab-btn {
      padding: 10px 18px;
      background: #1c1c1c;
      border: 1px solid #333;
      border-radius: 6px;
      cursor: pointer;
      color: #e0e0e0;
      transition: 0.25s;
      font-weight: bold;
    }

    .tab-btn.active {
      background: #444;
      border-color: #777;
    }

    /* ⭐ Android Ultra Scroll */
    .table-scroll {
      max-height: 800px;
      overflow-y: auto;
      overflow-x: auto;
      border-radius: 10px;
      margin-bottom: 40px;
      -webkit-overflow-scrolling: touch;
    }

    /* ⭐ Android Ultra Table */
    .tabela-premium {
      border-collapse: collapse;
      width: 100%;
      border-radius: 10px;
      overflow: visible; /* Android fix */
      box-shadow: 0 0 10px rgba(0,0,0,0.4);
      animation: fadeIn 0.4s ease;
    }

    .tabela-premium td, 
    .tabela-premium th {
      border: 1px solid rgba(255,255,255,0.1);
      padding: 10px 14px;
      color: #fff;
      white-space: nowrap;
      font-size: 15px;
      min-width: 110px; /* Android fix */
      will-change: transform; /* GPU boost */
    }

    .tabela-premium tr:nth-child(even) {
      background: rgba(255,255,255,0.05);
    }

    /* ⭐ Sticky nagłówki */
    .tabela-premium th {
      position: sticky;
      top: 0;
      background-color: #000; /* Android fix */
      z-index: 5;
    }

    /* ⭐ Sticky pierwsze 3 kolumny — BEZ kolorów */
    #tab_Podsumowanie td:nth-child(1),
    #tab_Podsumowanie th:nth-child(1) {
      position: sticky;
      left: 0;
      background-color: #141414;
      z-index: 7;
    }

    #tab_Podsumowanie td:nth-child(2),
    #tab_Podsumowanie th:nth-child(2) {
      position: sticky;
      left: 160px;
      background-color: #141414;
      z-index: 7;
    }

    #tab_Podsumowanie td:nth-child(3),
    #tab_Podsumowanie th:nth-child(3) {
      position: sticky;
      left: 320px;
      background-color: #141414;
      z-index: 7;
    }

    /* ⭐ Kolorowanie pozostałych kolumn */
    #tab_Podsumowanie td.crypt,
    #tab_Podsumowanie th.crypt {
      background-color: #1e3c72 !important;
    }

    #tab_Podsumowanie td.vault,
    #tab_Podsumowanie th.vault {
      background-color: #0f9b0f !important;
    }

    #tab_Podsumowanie td.hermes,
    #tab_Podsumowanie th.hermes {
      background-color: #ff8c00 !important;
    }

    #tab_Podsumowanie td.ancients,
    #tab_Podsumowanie th.ancients {
      background-color: #8e2de2 !important;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .hidden {
      display: none;
    }
  </style>
</head>
<body>

  <input type="text" id="dataOd" placeholder="od">
  <input type="text" id="dataDo" placeholder="do">

  <div class="tabs" id="tabs"></div>

  <div id="tabele"></div>

  <script>
    fetch("https://raw.githubusercontent.com/TBPWS/Licznik_v1.1/main/data.json")
      .then(r => r.json())
      .then(allSheets => {
        const container = document.getElementById("tabele");
        const tabs = document.getElementById("tabs");

        Object.keys(allSheets).forEach(sheetName => {

          if (sheetName.toLowerCase().includes("ranking")) return;
          if (sheetName === "Dane") return;

          const rows = allSheets[sheetName];

          const btn = document.createElement("button");
          btn.className = "tab-btn";
          btn.textContent = sheetName;
          btn.dataset.tab = sheetName;
          tabs.appendChild(btn);

          const wrapper = document.createElement("div");
          wrapper.className = "table-scroll hidden";
          wrapper.id = "tab_" + sheetName;

          const table = document.createElement("table");
          table.className = "tabela-premium";

          rows.forEach((row, index) => {
            const tr = document.createElement("tr");

            row.forEach((cell, colIndex) => {
              const td = document.createElement(index === 0 ? "th" : "td");
              td.textContent = cell;

              if (sheetName === "Podsumowanie" && colIndex >= 3) {
                const header = String(rows[0][colIndex]).toLowerCase();

                if (header.includes("crypt")) td.classList.add("crypt");
                else if (header.includes("vault")) td.classList.add("vault");
                else if (header.includes("hermes")) td.classList.add("hermes");
                else if (header.includes("ancients")) td.classList.add("ancients");
              }

              tr.appendChild(td);
            });

            table.appendChild(tr);
          });

          wrapper.appendChild(table);
          container.appendChild(wrapper);
        });

        document.querySelectorAll(".tab-btn").forEach(btn => {
          btn.addEventListener("click", () => {

            document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
            btn.classList.add("active");

            document.querySelectorAll(".table-scroll").forEach(t => t.classList.add("hidden"));

            const activeTable = document.getElementById("tab_" + btn.dataset.tab);
            activeTable.classList.remove("hidden");
          });
        });

        const firstBtn = document.querySelector(".tab-btn");
        if (firstBtn) firstBtn.click();
      });
  </script>

</body>
</html>
