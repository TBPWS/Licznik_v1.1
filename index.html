<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>Tabela z arkusza Google</title>
  <style>
    table {
      border-collapse: collapse;
      font-family: Arial;
    }
    td, th {
      border: 1px solid #ccc;
      padding: 6px 10px;
    }
    tr:nth-child(even) {
      background: #f7f7f7;
    }
  </style>
</head>
<body>
  <h2>Tabela z arkusza Google</h2>
  <table id="tabela"></table>

  <script>
    fetch("https://raw.githubusercontent.com/TBPW5/Licznik_v1.1/main/data.json")
      .then(r => r.json())
      .then(rows => {
        const table = document.getElementById("tabela");

        rows.forEach(row => {
          const tr = document.createElement("tr");
          row.forEach(cell => {
            const td = document.createElement("td");
            td.textContent = cell;
            tr.appendChild(td);
          });
          table.appendChild(tr);
        });
      })
      .catch(err => {
        document.body.innerHTML += "<p>Błąd wczytywania danych.</p>";
        console.error(err);
      });
  </script>
</body>
</html>
