<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>Tabele z arkusza Google — Premium Tabs</title>

  <style>
    body {
      font-family: Arial;
      background: #0f0f0f;
      color: #e0e0e0;
      padding: 20px;
    }

    input {
      margin-bottom: 10px;
      font-size: 16px;
      padding: 6px;
      background: #1c1c1c;
      border: 1px solid #333;
      color: #e0e0e0;
      border-radius: 6px;
    }

    /* PANEL ZAKŁADEK */
    .tabs {
      display: flex;
      gap: 10px;
      margin: 20px 0;
      flex-wrap: wrap;
    }

    .tab-btn {
      padding: 10px 18px;
      background: #1c1c1c;
      border: 1px solid #333;
      border-radius: 6px;
      cursor: pointer;
      color: #e0e0e0;
      transition: 0.25s;
      font-weight: bold;
    }

    .tab-btn:hover {
      background: #333;
    }

    .tab-btn.active {
      background: #444;
      border-color: #777;
    }

    /* KONTENER PRZEWIJANIA — POWIĘKSZONY */
    .table-scroll {
      max-height: 800px;
      overflow-y: auto;
      overflow-x: auto;
      border-radius: 10px;
      margin-bottom: 40px;
    }

    /* TABELA PREMIUM — SZEROKA */
    .tabela-premium {
      border-collapse: collapse;
      width: 100%;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 0 25px rgba(0,0,0,0.5);
      animation: fadeIn 0.4s ease;
    }

    .tabela-premium td, 
    .tabela-premium th {
      border: 1px solid rgba(255,255,255,0.1);
      padding: 10px 14px;
      color: #fff;
      white-space: nowrap;
      font-size: 15px;
    }

    .tabela-premium tr:nth-child(even) {
      background: rgba(255,255,255,0.05);
    }

    /* ZAMROŻONY NAGŁÓWEK */
    .tabela-premium th {
      position: sticky;
      top: 0;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(4px);
      z-index: 5;
    }

    /* ⭐ ZAMROŻENIE PIERWSZYCH 3 KOLUMN TYLKO W "Podsumowanie" ⭐ */
    #tab_Podsumowanie td:nth-child(1),
    #tab_Podsumowanie th:nth-child(1) {
      position: sticky;
      left: 0;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(4px);
      z-index: 7;
    }

    #tab_Podsumowanie td:nth-child(2),
    #tab_Podsumowanie th:nth-child(2) {
      position: sticky;
      left: 140px;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(4px);
      z-index: 7;
    }

    #tab_Podsumowanie td:nth-child(3),
    #tab_Podsumowanie th:nth-child(3) {
      position: sticky;
      left: 280px;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(4px);
      z-index: 7;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .hidden {
      display: none;
    }
  </style>
</head>
<body>

  <input type="text" id="dataOd" placeholder="od">
  <input type="text" id="dataDo" placeholder="do">

  <div class="tabs" id="tabs"></div>

  <div id="tabele"></div>

  <script>
    fetch("https://raw.githubusercontent.com/TBPWS/Licznik_v1.1/main/data.json")
      .then(r => r.json())
      .then(allSheets => {
        const container = document.getElementById("tabele");
        const tabs = document.getElementById("tabs");

        const koloryPremium = {
          "Crypt": "linear-gradient(135deg, #1e3c72, #2a5298)",
          "Vault": "linear-gradient(135deg, #0f9b0f, #00b300)",
          "Hermes": "linear-gradient(135deg, #ff8c00, #ffb347)",
          "Ancients": "linear-gradient(135deg, #8e2de2, #4a00e0)",
          "default": "linear-gradient(135deg, #333, #555)"
        };

        Object.keys(allSheets).forEach(sheetName => {

          if (sheetName === "Dane") return;
          if (sheetName === "Ranking") return;
          if (sheetName === "Historia") return;

          const rows = allSheets[sheetName];

          const btn = document.createElement("button");
          btn.className = "tab-btn";
          btn.textContent = sheetName;
          btn.dataset.tab = sheetName;
          tabs.appendChild(btn);

          const wrapper = document.createElement("div");
          wrapper.className = "table-scroll hidden";
          wrapper.id = "tab_" + sheetName;

          const table = document.createElement("table");
          table.className = "tabela-premium";

          let gradient = koloryPremium.default;
          if (sheetName.includes("Crypt")) gradient = koloryPremium.Crypt;
          if (sheetName.includes("Vault")) gradient = koloryPremium.Vault;
          if (sheetName.includes("Hermes")) gradient = koloryPremium.Hermes;
          if (sheetName.includes("Ancients")) gradient = koloryPremium.Ancients;

          table.style.background = gradient;

          rows.forEach((row, index) => {
            const tr = document.createElement("tr");

            row.forEach(cell => {
              const td = document.createElement(index === 0 ? "th" : "td");
              td.textContent = cell;
              tr.appendChild(td);
            });

            table.appendChild(tr);
          });

          wrapper.appendChild(table);
          container.appendChild(wrapper);
        });

        document.querySelectorAll(".tab-btn").forEach(btn => {
          btn.addEventListener("click", () => {

            document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
            btn.classList.add("active");

            document.querySelectorAll(".table-scroll").forEach(t => t.classList.add("hidden"));

            const activeTable = document.getElementById("tab_" + btn.dataset.tab);
            activeTable.classList.remove("hidden");
          });
        });

        const firstBtn = document.querySelector(".tab-btn");
        if (firstBtn) firstBtn.click();
      })
      .catch(err => {
        document.body.innerHTML += "<p>Błąd wczytywania danych.</p>";
        console.error(err);
      });
  </script>

</body>
</html>
