<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>Tabele z arkusza Google — Premium Tabs</title>

  <style>
    body {
      font-family: Arial;
      background: #0f0f0f;
      color: #e0e0e0;
      padding: 20px;
    }

    input {
      margin-bottom: 10px;
      font-size: 16px;
      padding: 6px;
      background: #1c1c1c;
      border: 1px solid #333;
      color: #e0e0e0;
      border-radius: 6px;
    }

    .tabs {
      display: flex;
      gap: 10px;
      margin: 20px 0;
      flex-wrap: wrap;
    }

    .tab-btn {
      padding: 10px 18px;
      background: #1c1c1c;
      border: 1px solid #333;
      border-radius: 6px;
      cursor: pointer;
      color: #e0e0e0;
      transition: 0.25s;
      font-weight: bold;
    }

    .tab-btn:hover {
      background: #333;
    }

    .tab-btn.active {
      background: #444;
      border-color: #777;
    }

    .table-scroll {
      max-height: 800px;
      overflow-y: auto;
      overflow-x: auto;
      white-space: nowrap;
      border-radius: 10px;
      margin-bottom: 40px;
    }

    .tabela-premium {
      border-collapse: collapse;
      width: max-content;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 0 25px rgba(0,0,0,0.5);
      animation: fadeIn 0.4s ease;
    }

    .tabela-premium td, 
    .tabela-premium th {
      border: 1px solid rgba(255,255,255,0.1);
      padding: 10px 14px;
      color: #fff;
      white-space: nowrap;
      font-size: 15px;
    }

    .tabela-premium tr:nth-child(even) {
      background: rgba(255,255,255,0.05);
    }

    .tabela-premium th {
      position: sticky;
      top: 0;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(4px);
      z-index: 5;
    }

    /* Kolory premium dla Podsumowanie */
    #tab_Podsumowanie td.crypt,
    #tab_Podsumowanie th.crypt {
      background: #1e3c72;
    }

    #tab_Podsumowanie td.vault,
    #tab_Podsumowanie th.vault {
      background: #0f9b0f;
    }

    #tab_Podsumowanie td.hermes,
    #tab_Podsumowanie th.hermes {
      background: #ff8c00;
    }

    #tab_Podsumowanie td.ancients,
    #tab_Podsumowanie th.ancients {
      background: #8e2de2;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .hidden {
      display: none;
    }
  </style>
</head>
<body>

  <input type="text" id="dataOd" placeholder="od">
  <input type="text" id="dataDo" placeholder="do">

  <div class="tabs" id="tabs"></div>

  <div id="tabele"></div>

  <script>

    function loadTables() {
      fetch("https://raw.githubusercontent.com/TBPWS/Licznik_v1.1/main/data.json")
        .then(r => r.json())
        .then(allSheets => {

          const container = document.getElementById("tabele");
          const tabs = document.getElementById("tabs");

          container.innerHTML = "";
          tabs.innerHTML = "";

          const koloryPremium = {
            "Crypt": "crypt",
            "Vault": "vault",
            "Hermes": "hermes",
            "Ancients": "ancients"
          };

          Object.keys(allSheets).forEach(sheetName => {

            if (sheetName === "Dane") return;
            if (sheetName === "Ranking Historia") return;

            const rows = allSheets[sheetName];

            const btn = document.createElement("button");
            btn.className = "tab-btn";
            btn.textContent = sheetName;
            btn.dataset.tab = sheetName;
            tabs.appendChild(btn);

            const wrapper = document.createElement("div");
            wrapper.className = "table-scroll hidden";
            wrapper.id = "tab_" + sheetName;

            const table = document.createElement("table");
            table.className = "tabela-premium";

            rows.forEach((row, index) => {
              const tr = document.createElement("tr");

              row.forEach((cell, colIndex) => {
                const td = document.createElement(index === 0 ? "th" : "td");
                td.textContent = cell;

                if (sheetName === "Podsumowanie" && colIndex >= 3) {
                  const header = rows[0][colIndex];

                  if (header.includes("Crypt")) td.classList.add("crypt");
                  if (header.includes("Vault")) td.classList.add("vault");
                  if (header.includes("Hermes")) td.classList.add("hermes");
                  if (header.includes("Ancients")) td.classList.add("ancients");
                }

                tr.appendChild(td);
              });

              table.appendChild(tr);
            });

            wrapper.appendChild(table);
            container.appendChild(wrapper);
          });

          document.querySelectorAll(".tab-btn").forEach(btn => {
            btn.addEventListener("click", () => {
              document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
              btn.classList.add("active");

              document.querySelectorAll(".table-scroll").forEach(t => t.classList.add("hidden"));

              const activeTable = document.getElementById("tab_" + btn.dataset.tab);
              activeTable.classList.remove("hidden");
            });
          });

          const firstBtn = document.querySelector(".tab-btn");
          if (firstBtn) firstBtn.click();
        })
        .catch(err => {
          document.body.innerHTML += "<p>Błąd wczytywania danych.</p>";
          console.error(err);
        });
    }

    loadTables();
    setInterval(loadTables, 600000);

  </script>

</body>
</html>
