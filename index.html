<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Licznik PWS</title>
    <style>
        /* Sztywne dopasowanie okna do ekranu komputera i telefonu */
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            overflow: hidden;
            background-color: #ffffff;
        }
        /* Pozycjonowanie wymuszające wewnętrzne suwaki z Google Sheets */
        iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <!-- Dokładnie Twój link z końcówką /edit osadzony w ramce strony -->
    <iframe src="https://docs.google.com/spreadsheets/d/1OmkKHiEm0jA9nhygs3UV8yOkhDYt3EntSV4YZf-zf8U/preview?gid=2052610161#gid=2052610161"></iframe>

</body>
</html>
